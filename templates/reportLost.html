<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Lost Item - LostInCampus</title>
    <meta name="description" content="Report a lost item on campus. Fill in details and we'll help you get it back." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="/" class="brand-logo">
          <div class="brand-badge"><i class="fa-solid fa-compass"></i></div>
          <div>LostIn<span>Campus</span></div>
        </a>
        <ul class="nav-links">
          <li><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="/lost-items" class="nav-link"><i class="fa-solid fa-circle-exclamation"></i> Lost Items</a></li>
          <li><a href="/found-items" class="nav-link"><i class="fa-solid fa-hand-holding-hand"></i> Found Items</a></li>
          <li><a href="/admin" class="nav-link" style="color: var(--admin-amber);"><i class="fa-solid fa-shield-halved"></i> Admin</a></li>
        </ul>
        <div class="nav-actions">
          <button id="theme-toggle" class="btn btn-outline btn-sm" type="button" title="Switch Theme">
            <i class="fa-solid fa-moon"></i> <span class="theme-text">Dark</span>
          </button>
          <a href="/report/lost" class="btn btn-danger btn-sm"><i class="fa-solid fa-plus"></i> Report Lost</a>
          <a href="/report/found" class="btn btn-secondary btn-sm"><i class="fa-solid fa-plus"></i> Report Found</a>
        </div>
      </div>
    </nav>

    <main class="container" style="flex-grow: 1;">
      <div class="form-card">
        <h1 style="font-size: 1.8rem; margin-bottom: 8px; color: var(--lost-red); display: flex; align-items: center; gap: 10px;">
          <i class="fa-solid fa-circle-exclamation"></i> Report Lost Item
        </h1>
        <p style="color: var(--text-muted); margin-bottom: 28px;">Fill out this form if you have lost a personal belonging on campus.</p>

        <form method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-user"></i> Full Name <span style="color: var(--lost-red);">*</span></label>
            <input type="text" name="name" class="form-control" required placeholder="Enter your full name" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-graduation-cap"></i> Class / Department <span style="color: var(--lost-red);">*</span></label>
            <input type="text" name="class_name" class="form-control" required placeholder="e.g. TE-IT / Faculty / Staff" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-phone"></i> Contact Phone Number <span style="color: var(--lost-red);">*</span></label>
            <input type="text" name="contact_number" class="form-control" required placeholder="e.g. +91 9876543210" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address <span style="color: var(--lost-red);">*</span></label>
            <input type="email" name="email" class="form-control" required placeholder="e.g. student@campus.edu" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-tag"></i> Item Name <span style="color: var(--lost-red);">*</span></label>
            <input type="text" name="item_name" class="form-control" required placeholder="e.g. Blue Wireless Headphones" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-align-left"></i> Description <span style="color: var(--lost-red);">*</span></label>
            <textarea name="description" class="form-control" required placeholder="Describe the item: brand, color, size, unique features, stickers..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-location-dot"></i> Where was it lost? <span style="color: var(--lost-red);">*</span></label>
            <input type="text" name="lost_location" class="form-control" required placeholder="e.g. Main Library, 2nd Floor Reading Room" />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-calendar"></i> Date Lost <span style="color: var(--lost-red);">*</span></label>
            <input type="date" name="lost_date" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-image"></i> Item Photo <span style="color: var(--text-muted); font-weight: 400;">(Optional)</span></label>
            <input type="file" name="image" class="form-control" accept="image/*" />
          </div>

          <div style="display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap;">
            <button type="submit" class="btn btn-danger">
              <i class="fa-solid fa-paper-plane"></i> Submit Lost Report
            </button>
            <a href="/" class="btn btn-outline">Cancel</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; {{ now.year }} LostInCampus &mdash; Campus Lost &amp; Found System</p>
      </div>
    </footer>
  </body>
</html>
