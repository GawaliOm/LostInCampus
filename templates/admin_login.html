<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - LostInCampus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        <div class="brand-badge"><i class="fa-solid fa-compass"></i></div>
        <div>LostIn<span>Campus</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="/lost-items" class="nav-link"><i class="fa-solid fa-circle-exclamation"></i> Lost Items</a></li>
        <li><a href="/found-items" class="nav-link"><i class="fa-solid fa-hand-holding-hand"></i> Found Items</a></li>
        <li><a href="/admin" class="nav-link active" style="color: var(--admin-amber);"><i class="fa-solid fa-shield-halved"></i> Admin</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="btn btn-outline btn-sm" type="button" title="Switch Theme">
          <i class="fa-solid fa-moon"></i> <span class="theme-text">Dark</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container" style="flex-grow: 1;">
    <div class="form-card" style="max-width: 440px; margin: 60px auto; border-color: rgba(217, 119, 6, 0.35);">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 56px; height: 56px; background: var(--admin-amber-bg); color: var(--admin-amber); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 1px solid rgba(217, 119, 6, 0.3); margin-bottom: 14px;">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 style="font-size: 1.6rem; margin-bottom: 4px;">Admin Portal</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Restricted access. Enter the security password to continue.</p>
      </div>

      {% if error %}
      <div style="background: var(--lost-red-bg); border: 1px solid var(--lost-red); color: var(--lost-red); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/admin">
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-key"></i> Password</label>
          <input type="password" name="password" id="admin-password" class="form-control" placeholder="Enter admin password" required autofocus />
        </div>

        <button type="submit" class="btn" id="admin-unlock-btn"
          style="width: 100%; margin-top: 8px; background: var(--admin-amber); color: #000; font-weight: 700; border: none;">
          <i class="fa-solid fa-shield-halved"></i> Unlock Admin Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ now.year }} LostInCampus &mdash; Campus Lost &amp; Found System</p>
    </div>
  </footer>
</body>
</html>
