<!doctype html>
<html>
  <head>
    <title>Found Item Details</title>
  </head>
  <body>
    <h1>Found Item Details</h1>

    <h2>{{ item.item_name }}</h2>

    <p><strong>Description:</strong> {{ item.description }}</p>

    <p><strong>Found Location:</strong> {{ item.found_location }}</p>

    <p><strong>Date Found:</strong> {{ item.found_date }}</p>

    <p><strong>Collection Place:</strong> {{ item.collection_place }}</p>

    <p><strong>Status:</strong> {{ item.status }}</p>

    <hr />

    <a href="/found-items">← Back to Found Items</a>
  </body>
</html>
