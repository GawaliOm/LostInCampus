<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Report - LostInCampus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="/" class="brand-logo">
          <div class="brand-badge"><i class="fa-solid fa-compass"></i></div>
          <div>LostIn<span>Campus</span></div>
        </a>
        <ul class="nav-links">
          <li><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="/lost-items" class="nav-link"><i class="fa-solid fa-circle-exclamation"></i> Lost Items</a></li>
          <li><a href="/found-items" class="nav-link"><i class="fa-solid fa-hand-holding-hand"></i> Found Items</a></li>
          <li><a href="/admin" class="nav-link" style="color: var(--admin-amber);"><i class="fa-solid fa-shield-halved"></i> Admin</a></li>
        </ul>
        <div class="nav-actions">
          <button id="theme-toggle" class="btn btn-outline btn-sm" type="button" title="Switch Theme">
            <i class="fa-solid fa-moon"></i> <span class="theme-text">Dark</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="container" style="flex-grow: 1;">
      <div class="form-card" style="max-width: 500px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 52px; height: 52px; background: var(--lost-red-bg); color: var(--lost-red); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 1px solid rgba(220, 38, 38, 0.3); margin-bottom: 12px;">
            <i class="fa-solid fa-trash-can"></i>
          </div>
          <h1 style="font-size: 1.6rem; margin-bottom: 6px; color: var(--lost-red);">Delete Report</h1>
          <p style="color: var(--text-muted); font-size: 0.875rem;">Enter the email address you used when submitting this {{ report_type }} report to verify ownership.</p>
        </div>

        {% if error %}
          <div style="background: var(--lost-red-bg); border: 1px solid var(--lost-red); color: var(--lost-red); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
          </div>
        {% endif %}

        <form method="POST">
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address <span style="color: var(--lost-red);">*</span></label>
            <input type="email" name="email" id="delete-email" class="form-control" required placeholder="Enter the email used when reporting" autofocus />
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-danger" id="confirm-delete-btn" style="flex: 1;">
              <i class="fa-solid fa-trash-can"></i> Confirm Delete
            </button>
            <a href="/" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; {{ now.year }} LostInCampus &mdash; Campus Lost &amp; Found System</p>
      </div>
    </footer>
  </body>
</html>
