<!doctype html>
<html>
  <head>
    <title>Delete Report - LostInCampus</title>
  </head>

  <body>
    <h1>Delete My Report</h1>

    <p>Enter the email address you used when submitting this report.</p>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
      <label>Email:</label><br />
      <input type="email" name="email" required />

      <br /><br />

      <button type="submit">Delete Report</button>
    </form>

    <br />

    <a href="/">← Back to Home</a>
  </body>
</html>
